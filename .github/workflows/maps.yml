name: Maps

# MapAround's offline maps (see the README): OpenStreetMap extracts from Geofabrik,
# written as mapsforge .map files with marked trails, cliffs, path and track grades and more.
# They go to a release per month (maps-YYYY-MM) and are listed in catalog.json on the
# maps-latest release, which the app reads. Regions too big for these free machines are listed
# as needing funding. Monthly, or by hand (for some regions, or with another size limit).

on:
  schedule:
    - cron: "17 3 16 * *" # the 16th of each month
  workflow_dispatch:
    inputs:
      only:
        description: "Regions to build, space-separated (e.g. europe/malta asia/israel-and-palestine); empty: all"
        required: false
        default: ""
      max_mb:
        description: "Biggest OpenStreetMap extract to build, MB (bigger ones are listed as needing funding)"
        required: false
        default: "1500"

permissions:
  contents: write # the map releases

concurrency:
  group: maps
  cancel-in-progress: false

env:
  PYTHONUNBUFFERED: "1"

jobs:
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      batches: ${{ steps.plan.outputs.batches }}
      tag: ${{ steps.plan.outputs.tag }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: What to build, in which job
        id: plan
        env:
          ONLY: ${{ inputs.only }}
          MAX_MB: ${{ inputs.max_mb || '1500' }}
        run: python maps.py plan --out plan.json --max-mb "$MAX_MB" --only "$ONLY"

      - uses: actions/upload-artifact@v4
        with:
          name: plan
          path: plan.json

      - name: This month's release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.plan.outputs.tag }}
        run: |
          gh release view "$TAG" >/dev/null 2>&1 || gh release create "$TAG" --latest=false \
            --title "Maps ${TAG#maps-}" \
            --notes "Offline maps for MapAround, made from OpenStreetMap data (© OpenStreetMap contributors, ODbL). The app lists them through catalog.json on the maps-latest release; see the README."

      # The coastline (land polygons, ~1 GB), downloaded once for all jobs.
      - uses: actions/cache@v4
        id: land
        with:
          path: land
          key: land-${{ steps.plan.outputs.tag }}
      - if: steps.land.outputs.cache-hit != 'true'
        run: python maps.py land --land land

  build:
    needs: plan
    if: needs.plan.outputs.batches != '[]'
    runs-on: ubuntu-latest
    timeout-minutes: 350
    strategy:
      fail-fast: false
      max-parallel: 20
      matrix:
        batch: ${{ fromJSON(needs.plan.outputs.batches) }}
    steps:
      - uses: actions/checkout@v4

      - name: More disk space (preinstalled SDKs this job doesn't use)
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL /usr/share/swift
          df -h /

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install osmium==4.* shapely==2.* pyshp==3.*

      - uses: actions/cache@v4
        with:
          path: tools-cache
          key: maps-tools-osmosis-0.49.2-writer-0.25.0
      - run: python maps.py setup --tools tools-cache

      - uses: actions/cache/restore@v4
        with:
          path: land
          key: land-${{ needs.plan.outputs.tag }}
          fail-on-cache-miss: true

      - uses: actions/download-artifact@v4
        with:
          name: plan

      - name: Build and upload the maps
        env:
          GH_TOKEN: ${{ github.token }}
        run: >
          python maps.py build --plan plan.json --batch ${{ matrix.batch }}
          --tools tools-cache --land land --work work --out out --results results
          --release ${{ needs.plan.outputs.tag }}

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: results-${{ matrix.batch }}
          path: results
          if-no-files-found: ignore

  catalog:
    needs: [plan, build]
    if: always() && needs.plan.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/download-artifact@v4
        with:
          name: plan

      - uses: actions/download-artifact@v4
        with:
          pattern: results-*
          path: results

      - name: catalog.json on the maps-latest release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view maps-latest >/dev/null 2>&1 || gh release create maps-latest --latest=false \
            --title "Maps catalog" \
            --notes "catalog.json: the list of MapAround's offline maps, which the app reads. Updated by the Maps workflow (see the README)."
          gh release download maps-latest --pattern catalog.json --output previous.json || true
          mkdir -p results
          python maps.py catalog --plan plan.json --results results --previous previous.json --out catalog.json --prune
          gh release upload maps-latest catalog.json --clobber

      # Also on the `catalog` branch: browsers can read raw.githubusercontent.com from other sites
      # (CORS), which release downloads don't allow; the web app reads it there.
      - name: catalog.json on the catalog branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p "$RUNNER_TEMP/catalog" && cp catalog.json "$RUNNER_TEMP/catalog/"
          cd "$RUNNER_TEMP/catalog"
          git init -q -b catalog
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add catalog.json
          git commit -q -m "Map catalog $(date -u +%Y-%m-%d)"
          git push -q -f "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" catalog
